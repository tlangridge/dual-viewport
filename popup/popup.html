<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-weight: 500;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #4285f4;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #3367d6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error {
      color: #d93025;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h3>Dual Viewport</h3>

  <label for="device">Device</label>
  <select id="device">
    <option value="0">iPhone 14 (390 x 844)</option>
    <option value="1">Pixel 7 (412 x 915)</option>
    <option value="2">iPad (820 x 1180)</option>
    <option value="3">Custom (375 x 667)</option>
  </select>

  <label for="url">URL</label>
  <input type="text" id="url" placeholder="https://example.com">
  <div id="error" class="error" style="display: none;"></div>

  <button id="launch">Launch Dual View</button>

  <script src="popup.js"></script>
</body>
</html>
